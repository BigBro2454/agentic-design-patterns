[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-design-patterns"
version = "1.0.0"
description = "Production implementations of the 21 Agentic Design Patterns powered by Google Gemini, LangGraph, and Model Context Protocol (MCP)"
readme = "README.md"
authors = [{ name = "Ishan Dhiman" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.2.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=0.0.9",
    "langgraph>=0.0.26",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/BigBro2454/agentic-design-patterns"
Repository = "https://github.com/BigBro2454/agentic-design-patterns"
