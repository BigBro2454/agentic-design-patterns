name: CI Pipeline & Pattern Validation Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Syntax & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python Syntax Across All Patterns
        run: |
          python -m py_compile $(find patterns shared tests -name "*.py") run_pattern.py

  test-matrix:
    name: Headless Pattern Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Headless Validation Suite
        env:
          MOCK_LLM: "true"
          CI: "true"
        run: |
          pytest tests/ -v --durations=10

      - name: Execute Full 21-Pattern CLI Matrix
        env:
          MOCK_LLM: "true"
          CI: "true"
        run: |
          python run_pattern.py --all --mock
